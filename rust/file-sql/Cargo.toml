[package]
name = "file-sql"
version = "0.1.0"
edition = "2021"
publish = false
links = "file_sql"

[lib]
name = "file_sql"
crate-type = ["rlib", "staticlib"]

[dependencies]
cxx = "1"
csv = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parquet = { version = "56.2", default-features = false, features = ["snap"] }
glob = "0.3"
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[build-dependencies]
cxx-build = "1"

[dev-dependencies]
base64 = "0.22"
